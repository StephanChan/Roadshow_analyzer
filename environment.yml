# 路演分析平台 - Conda 环境文件（精确锁定版本）
#
# 创建环境（自动安装全部依赖）：
#   conda env create -f environment.yml
#
# 如果 environment.yml 不在当前目录，请先 cd 到该目录：
#   cd /d d:\BaiduSyncdisk\南科大博后材料\抗癌药物筛选\26年医企创业比赛\roadshow_analyzer_py
#   conda env create -f environment.yml
#
# 激活环境：
#   conda activate roadshow_analyzer
#
# 在 Spyder 中使用该环境：
#   工具 → 偏好设置 → Python 解释器 → 使用以下解释器 →
#   选择: C:\Users\shuai\.conda\envs\roadshow_analyzer\python.exe
#
# 重装环境（如损坏）：
#   conda deactivate
#   conda env remove -n roadshow_analyzer
#   conda env create -f environment.yml
#
# 如果 faster-whisper 没装上（报"缺少 faster-whisper 依赖"），单独补装：
#   conda activate roadshow_analyzer
#   pip install faster-whisper==1.0.3 ctranslate2==4.4.0

name: roadshow_analyzer
channels:
  - conda-forge
  - defaults

dependencies:
  # ---- 基础运行环境 ----
  # 注意：不要用 python=3.11.9，该版本在 Windows 上有已知 ssl 证书缺陷
  # （ssl.SSLError: [ASN1: NOT_ENOUGH_DATA]，导致 Spyder/aiohttp 打不开），
  # 3.11.10 起已修复。若 conda 解析不到 3.11.10，可用 3.11.8。
  - python=3.11.10
  - pip=24.0
  # setuptools 必须装：ctranslate2（faster-whisper 底层）依赖其 pkg_resources 模块。
  # Python 3.12+ / 新 conda 环境默认不捆绑 setuptools，缺失会导致
  # "ModuleNotFoundError: No module named 'pkg_resources'"。
  - setuptools=69.5.1

  # ---- 科学计算 / 网络 ----
  - numpy=1.26.4
  - requests=2.32.3
  - pillow=10.3.0

  # ---- 语音转录（faster-whisper CPU int8 量化）----
  # 注意：这些包只能通过 pip 安装（conda 源没有或版本滞后）。
  # 若 conda env create 时 pip 段部分安装失败，导致 faster_whisper 缺失，
  # 请执行：pip install faster-whisper==1.0.3 ctranslate2==4.4.0
  - pip:
      - faster-whisper==1.0.3
      - ctranslate2==4.4.0
      - tokenizers==0.19.1
      - huggingface-hub==0.24.0
      - onnxruntime==1.18.1
      - av==12.2.0
      - tqdm==4.66.4
      - safetensors==0.4.4
      - filelock==3.15.1
      - regex==2024.5.15

      # OCR（pytesseract 只是 Python 封装，还需单独安装 tesseract.exe 本体）
      - pytesseract==0.3.13

      # 可选：繁简转换 / 中文分词
      - opencc-python-reimplemented==0.1.7
      - jieba==0.42.1